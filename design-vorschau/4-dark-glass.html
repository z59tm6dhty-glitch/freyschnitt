<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freyschnitt – Variante 4: Dark Glass</title>
<style>
  :root {
    --bg: #0d0d0e;
    --text: #f2f2f0;
    --muted: rgba(242,242,240,.62);
    --accent: #d4ff3a;
    --accent-text: #0d0d0e;
    --glass: rgba(255,255,255,.06);
    --glass-strong: rgba(255,255,255,.11);
    --edge: rgba(255,255,255,.14);
    --radius: 26px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--text); background: var(--bg); overflow-x: hidden; }

  /* Leuchtende Flächen hinter dem Glas: Neongelb + dunkles Oliv/Grau */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .bg span { position: absolute; border-radius: 50%; filter: blur(70px); animation: float 20s ease-in-out infinite alternate; }
  .bg span:nth-child(1) { width: 55vmax; height: 55vmax; background: #d4ff3a; opacity: .30; top: -22vmax; right: -18vmax; }
  .bg span:nth-child(2) { width: 50vmax; height: 50vmax; background: #3b4a12; opacity: .55; bottom: -18vmax; left: -20vmax; animation-delay: -7s; }
  .bg span:nth-child(3) { width: 35vmax; height: 35vmax; background: #d4ff3a; opacity: .14; top: 45%; left: 35%; animation-delay: -13s; }
  @keyframes float { to { transform: translate(5vmax, 4vmax) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .bg span { animation: none; } }

  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  .glass {
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    backdrop-filter: blur(26px) saturate(160%);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 24px 60px rgba(0,0,0,.45);
  }
  header.glass { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-radius: 999px; }
  .logo { font-family: var(--mono); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
  .logo b { color: var(--accent); font-weight: 400; }
  nav a { color: var(--muted); text-decoration: none; font-family: var(--mono); font-size: 13px; }

  h1 { font-size: clamp(46px, 15vw, 76px); line-height: .9; letter-spacing: -.05em; margin: 40px 4px 16px; font-weight: 900; text-transform: uppercase; }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 4px 28px; max-width: 32ch; }

  section.glass { padding: 20px; margin-bottom: 16px; }
  h2 { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; font-weight: 500; }
  .day { margin-bottom: 18px; }
  .day:last-child { margin-bottom: 0; }
  .day-title { font-weight: 600; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--edge); background: rgba(255,255,255,.05); color: var(--text);
    padding: 10px 16px; border-radius: 999px; font-family: var(--mono); font-size: 15px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; box-shadow: 0 0 24px rgba(212,255,58,.35); }

  label { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); padding: 13px 15px;
    background: rgba(0,0,0,.28); border: 1px solid var(--edge); border-radius: 16px; outline: none;
  }
  input::placeholder, textarea::placeholder { color: rgba(242,242,240,.38); }
  select option { color: #000; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-family: inherit; text-transform: none; letter-spacing: 0; font-size: 14px; margin-top: 18px; }
  .check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); }
  .check a { color: var(--text); }
  .btn {
    width: 100%; margin-top: 20px; padding: 16px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 800; font-size: 16px;
    text-transform: uppercase; letter-spacing: .06em; cursor: pointer;
    box-shadow: 0 10px 34px rgba(212,255,58,.28);
  }
  .picked { background: var(--glass-strong); border-radius: 16px; padding: 12px 14px; font-family: var(--mono); color: var(--accent); }
  footer { text-align: center; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 28px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="bg"><span></span><span></span><span></span></div>
<div class="wrap">
  <header class="glass">
    <div class="logo">frey<b>/</b>schnitt</div>
    <nav><a href="#termine">TERMINE →</a></nav>
  </header>

  <h1>Kopf<br>frei<em>.</em></h1>
  <p class="lead">Slot aussuchen, Namen rein, fertig. Bestätigung kommt per Mail.</p>

  <section class="glass" id="termine">
    <h2>Freie Termine</h2>
    <div class="day">
      <div class="day-title">Dienstag, 24. November</div>
      <div class="chips">
        <button class="chip">18:00</button><button class="chip" aria-pressed="true">18:45</button>
        <button class="chip">19:30</button><button class="chip">20:15</button>
      </div>
    </div>
    <div class="day">
      <div class="day-title">Donnerstag, 26. November</div>
      <div class="chips">
        <button class="chip">18:00</button><button class="chip">19:30</button><button class="chip">20:15</button>
      </div>
    </div>
  </section>

  <section class="glass">
    <h2>Buchen</h2>
    <div class="picked">→ Di 24.11 · 18:45–19:30</div>
    <label for="n">Name</label><input id="n" placeholder="Dein Name">
    <label for="e">E-Mail</label><input id="e" type="email" placeholder="du@beispiel.de">
    <label for="s">Leistung</label>
    <select id="s"><option>Haarschnitt</option><option>Haarschnitt + Bart</option><option>Nur Bart</option></select>
    <label for="no">Notiz (optional)</label><textarea id="no" rows="3" placeholder="z. B. Seiten kürzer als letztes Mal"></textarea>
    <label class="check"><input type="checkbox"> <span>Ich habe die <a href="#">Datenschutzerklärung</a> gelesen und bin einverstanden.</span></label>
    <button class="btn">Termin buchen</button>
  </section>

  <footer><a href="#">Datenschutz</a> · <a href="#">Impressum</a></footer>
</div>
</body>
</html>
