<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freyschnitt – Variante 1: Liquid Glass</title>
<style>
  :root {
    --text: #fff;
    --muted: rgba(255,255,255,.72);
    --glass: rgba(255,255,255,.14);
    --glass-strong: rgba(255,255,255,.26);
    --edge: rgba(255,255,255,.38);
    --radius: 26px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: #1b1030;
    overflow-x: hidden;
  }
  /* Farbige "Blobs" hinter dem Glas */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .bg span { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .85; animation: float 18s ease-in-out infinite alternate; }
  .bg span:nth-child(1) { width: 60vmax; height: 60vmax; background: #7b5cff; top: -20vmax; left: -15vmax; }
  .bg span:nth-child(2) { width: 50vmax; height: 50vmax; background: #ff7aa8; bottom: -15vmax; right: -20vmax; animation-delay: -6s; }
  .bg span:nth-child(3) { width: 40vmax; height: 40vmax; background: #2fd4ff; top: 35%; left: 30%; animation-delay: -12s; opacity: .55; }
  @keyframes float { to { transform: translate(6vmax, 4vmax) scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { .bg span { animation: none; } }

  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(170%);
    backdrop-filter: blur(28px) saturate(170%);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 20px 50px rgba(20,0,60,.25);
  }
  header.glass { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-radius: 999px; }
  .logo { font-weight: 700; letter-spacing: -.02em; font-size: 18px; }
  .logo b { opacity: .6; font-weight: 500; }
  nav a { color: var(--text); text-decoration: none; font-size: 14px; opacity: .85; }

  h1 { font-size: clamp(34px, 9vw, 48px); line-height: 1.02; letter-spacing: -.035em; margin: 40px 4px 12px; }
  .lead { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 4px 28px; }

  section.glass { padding: 20px; margin-bottom: 16px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .day { margin-bottom: 18px; }
  .day:last-child { margin-bottom: 0; }
  .day-title { font-weight: 600; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--edge); background: rgba(255,255,255,.1); color: var(--text);
    padding: 10px 16px; border-radius: 999px; font: inherit; font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: #fff; color: #2a1660; border-color: #fff; font-weight: 600; }

  label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--text); padding: 13px 15px;
    background: rgba(255,255,255,.12); border: 1px solid var(--edge); border-radius: 16px; outline: none;
  }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,.5); }
  select option { color: #000; }
  input:focus, select:focus, textarea:focus { border-color: #fff; background: rgba(255,255,255,.2); }
  .check { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: 14px; margin-top: 16px; }
  .check input { width: 20px; height: 20px; margin-top: 2px; accent-color: #fff; }
  .check a { color: #fff; }
  .btn {
    width: 100%; margin-top: 20px; padding: 16px; border: 0; border-radius: 999px;
    background: #fff; color: #2a1660; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(255,255,255,.25);
  }
  .picked { background: var(--glass-strong); border-radius: 16px; padding: 12px 14px; font-weight: 600; }
  footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 28px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="bg"><span></span><span></span><span></span></div>
<div class="wrap">
  <header class="glass">
    <div class="logo">frey<b>schnitt</b></div>
    <nav><a href="#termine">Termine</a></nav>
  </header>

  <h1>Frischer Schnitt.<br>Unter Kumpels.</h1>
  <p class="lead">Such dir einen freien Slot aus, trag dich ein, fertig. Du bekommst eine Bestätigung per Mail.</p>

  <section class="glass" id="termine">
    <h2>Freie Termine</h2>
    <div class="day">
      <div class="day-title">Dienstag, 24. November</div>
      <div class="chips">
        <button class="chip">18:00</button><button class="chip" aria-pressed="true">18:45</button>
        <button class="chip">19:30</button><button class="chip">20:15</button>
      </div>
    </div>
    <div class="day">
      <div class="day-title">Donnerstag, 26. November</div>
      <div class="chips">
        <button class="chip">18:00</button><button class="chip">19:30</button><button class="chip">20:15</button>
      </div>
    </div>
  </section>

  <section class="glass">
    <h2>Buchen</h2>
    <div class="picked">Di, 24.11. · 18:45–19:30</div>
    <label for="n">Name</label><input id="n" placeholder="Dein Name">
    <label for="e">E-Mail</label><input id="e" type="email" placeholder="du@beispiel.de">
    <label for="s">Was soll's sein?</label>
    <select id="s"><option>Haarschnitt</option><option>Haarschnitt + Bart</option><option>Nur Bart</option></select>
    <label for="no">Notiz (optional)</label><textarea id="no" rows="3" placeholder="z. B. Seiten kürzer als letztes Mal"></textarea>
    <label class="check"><input type="checkbox"> <span>Ich habe die <a href="#">Datenschutzerklärung</a> gelesen und bin einverstanden.</span></label>
    <button class="btn">Termin buchen</button>
  </section>

  <footer><a href="#">Datenschutz</a> · <a href="#">Impressum</a></footer>
</div>
</body>
</html>
