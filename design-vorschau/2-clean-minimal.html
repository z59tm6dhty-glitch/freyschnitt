<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freyschnitt – Variante 2: Clean</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --text: #111; --muted: #6b6b6b; --line: #e6e6e2;
    --accent: #111; --accent-text: #fff; --soft: #eef0ff; --brand: #3d4bff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .logo i { width: 22px; height: 22px; border-radius: 7px; background: var(--brand); display: inline-block; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }

  h1 { font-size: clamp(32px, 8.5vw, 44px); letter-spacing: -.035em; line-height: 1.05; margin: 24px 0 10px; }
  .lead { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 0 28px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .step { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .step span { width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: #fff; display: grid; place-items: center; font-size: 12px; }

  /* Wochen-Leiste */
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -4px; padding-left: 4px; scrollbar-width: none; }
  .d { flex: 0 0 58px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 0; text-align: center; background: #fff; }
  .d small { display: block; font-size: 12px; color: var(--muted); }
  .d b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .d.off { opacity: .35; }
  .d.on { background: var(--text); color: #fff; border-color: var(--text); }
  .d.on small { color: rgba(255,255,255,.7); }
  .d .dot { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); margin: 6px auto 0; }
  .d.on .dot { background: #fff; }

  .times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .t { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 0; font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; }
  .t.sel { background: var(--soft); border-color: var(--brand); color: var(--brand); }

  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input, select, textarea { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
  .check { display: flex; gap: 10px; font-weight: 400; color: var(--muted); align-items: flex-start; }
  .check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--brand); }
  .check a { color: var(--text); }
  .summary { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
  .summary a { color: var(--brand); font-size: 14px; text-decoration: none; }
  .btn { width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 700; font-size: 16px; }
  footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 24px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo"><i></i>freyschnitt</div><a href="#">Termine</a></header>

  <h1>Termin für deinen nächsten Schnitt.</h1>
  <p class="lead">Tag wählen, Uhrzeit wählen, eintragen. Die Bestätigung kommt per Mail.</p>

  <div class="card">
    <div class="step"><span>1</span>Tag &amp; Uhrzeit</div>
    <div class="days">
      <div class="d off"><small>Mo</small><b>23</b></div>
      <div class="d on"><small>Di</small><b>24</b><i class="dot"></i></div>
      <div class="d off"><small>Mi</small><b>25</b></div>
      <div class="d"><small>Do</small><b>26</b><i class="dot"></i></div>
      <div class="d off"><small>Fr</small><b>27</b></div>
      <div class="d off"><small>Sa</small><b>28</b></div>
      <div class="d off"><small>So</small><b>29</b></div>
      <div class="d off"><small>Mo</small><b>30</b></div>
      <div class="d"><small>Di</small><b>1</b><i class="dot"></i></div>
    </div>
    <div class="times">
      <button class="t">18:00</button><button class="t sel">18:45</button><button class="t">19:30</button>
      <button class="t">20:15</button>
    </div>
  </div>

  <div class="card">
    <div class="step"><span>2</span>Deine Angaben</div>
    <div class="summary"><span><b>Di, 24. Nov</b> · 18:45–19:30</span><a href="#">ändern</a></div>
    <label for="n">Name</label><input id="n" placeholder="Dein Name">
    <label for="e">E-Mail</label><input id="e" type="email" placeholder="du@beispiel.de">
    <label for="s">Leistung</label>
    <select id="s"><option>Haarschnitt</option><option>Haarschnitt + Bart</option><option>Nur Bart</option></select>
    <label for="no">Notiz <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea id="no" rows="3"></textarea>
    <label class="check"><input type="checkbox"> <span>Ich habe die <a href="#">Datenschutzerklärung</a> gelesen und bin einverstanden.</span></label>
    <button class="btn">Termin buchen</button>
  </div>

  <footer><a href="#">Datenschutz</a> · <a href="#">Impressum</a></footer>
</div>
</body>
</html>
