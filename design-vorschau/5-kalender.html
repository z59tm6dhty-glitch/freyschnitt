<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freyschnitt – Variante 5: Kalender</title>
<!-- Inspiration: Cal.com / Calendly – Monatskalender, Zeiten daneben, ruhig und hell -->
<style>
  :root {
    --bg: #f5f5f3; --card: #ffffff; --text: #111113; --muted: #6b6b70; --line: #e6e6e3;
    --accent: #111113; --hi: #d4ff3a; --soft: #f0f0ec;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .logo { font-family: var(--mono); font-size: 13px; letter-spacing: .14em; }
  .logo b { background: var(--hi); padding: 0 3px; font-weight: 400; }
  .pill { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--card); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.05); overflow: hidden; }
  .grid { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .grid { grid-template-columns: 240px 1fr 220px; } .grid > * + * { border-left: 1px solid var(--line); } }
  @media (max-width: 759px) { .grid > * + * { border-top: 1px solid var(--line); } }
  .pane { padding: 22px; }

  .who { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--text); color: var(--hi); display: grid; place-items: center; font-weight: 800; }
  .who small { color: var(--muted); display: block; font-size: 13px; }
  h1 { font-size: 22px; margin: 0 0 14px; letter-spacing: -.02em; }
  .meta { list-style: none; padding: 0; margin: 0; color: var(--muted); font-size: 14px; display: grid; gap: 10px; }
  .meta li { display: flex; gap: 8px; align-items: center; }

  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .cal-head strong { font-size: 16px; }
  .cal-head button { border: 1px solid var(--line); background: var(--card); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; }
  .dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .dow span { font-size: 11px; color: var(--muted); letter-spacing: .06em; padding-bottom: 6px; }
  .days button { aspect-ratio: 1; border: 0; border-radius: 12px; background: none; font: inherit; font-size: 15px; color: #b5b5b0; cursor: default; position: relative; }
  .days button.free { background: var(--soft); color: var(--text); font-weight: 600; cursor: pointer; }
  .days button.free:hover { outline: 1.5px solid var(--text); }
  .days button.sel { background: var(--text); color: #fff; }
  .days button.today::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }

  .times h3 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .times h3 span { color: var(--muted); font-weight: 400; }
  .slots { display: grid; gap: 8px; }
  .slot { display: flex; gap: 8px; }
  .slot button { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; font: inherit; font-family: var(--mono); font-size: 14px; cursor: pointer; transition: .15s; }
  .slot button:hover { border-color: var(--text); }
  .slot.sel button.t { background: #3a3a3e; color: #fff; border-color: #3a3a3e; flex: .5; }
  .slot .go { display: none; background: var(--hi); border-color: var(--hi); font-family: inherit; font-weight: 700; }
  .slot.sel .go { display: block; }

  form { margin-top: 18px; display: none; }
  form.on { display: block; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input, textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); }
  input:focus, textarea:focus { outline: 2px solid var(--text); outline-offset: -1px; }
  .btn { margin-top: 18px; width: 100%; border: 0; border-radius: 12px; padding: 14px; background: var(--text); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">FREY<b>/</b>SCHNITT</div>
    <span class="pill">🔒 Nur für Freunde</span>
  </header>

  <div class="card grid">
    <aside class="pane">
      <div class="who"><div class="avatar">F</div><div><strong>Freyschnitt</strong><small>Haare unter Freunden</small></div></div>
      <h1>Haarschnitt</h1>
      <ul class="meta">
        <li>⏱ 45 Minuten</li>
        <li>📍 Penthouse</li>
        <li>📅 Kalendereinladung per Mail</li>
      </ul>
    </aside>

    <section class="pane">
      <div class="cal-head"><strong id="month"></strong><span><button aria-label="Vorheriger Monat">‹</button> <button aria-label="Nächster Monat">›</button></span></div>
      <div class="dow"><span>MO</span><span>DI</span><span>MI</span><span>DO</span><span>FR</span><span>SA</span><span>SO</span></div>
      <div class="days" id="days"></div>
    </section>

    <section class="pane times">
      <h3 id="dayname">Tag wählen</h3>
      <div class="slots" id="slots"></div>
      <form id="form">
        <label for="n">Name</label><input id="n" placeholder="Dein Name">
        <label for="e">E-Mail</label><input id="e" type="email" placeholder="du@beispiel.de">
        <label for="t">Notiz</label><textarea id="t" rows="2" placeholder="Optional"></textarea>
        <button class="btn" type="button">Termin buchen</button>
      </form>
    </section>
  </div>
  <p class="note">Vorschau 5 · Kalender (à la Cal.com / Calendly)</p>
</div>
<script>
  const today = new Date(2026, 10, 21);
  const free = { 24: ["18:00","18:45","19:30"], 26: ["18:00","19:30","20:15"], 28: ["11:00","11:45","14:00","15:00"], 1: [], 3: ["18:00","18:45"] };
  const y = today.getFullYear(), m = today.getMonth();
  document.getElementById("month").textContent = new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" }).format(today);
  const first = (new Date(y, m, 1).getDay() + 6) % 7, len = new Date(y, m + 1, 0).getDate();
  const days = document.getElementById("days");
  for (let i = 0; i < first; i++) days.append(document.createElement("span"));
  for (let d = 1; d <= len; d++) {
    const b = document.createElement("button"); b.textContent = d;
    if (d === today.getDate()) b.classList.add("today");
    if (free[d]?.length && d > today.getDate()) { b.classList.add("free"); b.onclick = () => pick(d, b); }
    days.append(b);
  }
  function pick(d, btn) {
    days.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); btn.classList.add("sel");
    const dt = new Date(y, m, d);
    document.getElementById("dayname").innerHTML = new Intl.DateTimeFormat("de-DE", { weekday: "long" }).format(dt) + " <span>" + d + ". Nov.</span>";
    const s = document.getElementById("slots"); s.innerHTML = ""; document.getElementById("form").classList.remove("on");
    free[d].forEach(t => {
      const row = document.createElement("div"); row.className = "slot";
      row.innerHTML = `<button class="t" type="button">${t}</button><button class="go" type="button">Weiter</button>`;
      row.querySelector(".t").onclick = () => { s.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); row.classList.add("sel"); };
      row.querySelector(".go").onclick = () => document.getElementById("form").classList.add("on");
      s.append(row);
    });
  }
  pick(28, [...days.querySelectorAll("button")].find(b => b.textContent === "28"));
</script>
</body>
</html>
