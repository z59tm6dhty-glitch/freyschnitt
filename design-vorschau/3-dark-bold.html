<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freyschnitt – Variante 3: Dark Bold</title>
<style>
  :root {
    --bg: #0d0d0e; --card: #17171a; --line: #2a2a2f; --text: #f2f2f0; --muted: #8d8d93;
    --accent: #d4ff3a; --accent-text: #0d0d0e;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .logo { font-family: var(--mono); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
  .logo b { color: var(--accent); }
  header a { color: var(--muted); font-family: var(--mono); font-size: 13px; text-decoration: none; }

  h1 { font-size: clamp(46px, 15vw, 76px); line-height: .9; letter-spacing: -.05em; margin: 36px 0 16px; font-weight: 900; text-transform: uppercase; }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 0 32px; max-width: 30ch; }

  h2 { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 500; }
  .list { border-top: 1px solid var(--line); margin-bottom: 32px; }
  .row { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .date { font-family: var(--mono); line-height: 1.2; }
  .date b { display: block; font-size: 26px; font-weight: 700; }
  .date small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; }
  .s { font-family: var(--mono); font-size: 15px; background: transparent; color: var(--text); border: 1px solid var(--line); padding: 10px 14px; border-radius: 4px; }
  .s.sel { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }

  .form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .picked { font-family: var(--mono); color: var(--accent); font-size: 15px; margin-bottom: 4px; }
  label { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 13px 14px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .check { display: flex; gap: 10px; font-family: inherit; text-transform: none; letter-spacing: 0; font-size: 14px; align-items: flex-start; }
  .check input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--accent); }
  .check a { color: var(--text); }
  .btn { width: 100%; margin-top: 22px; padding: 17px; border: 0; border-radius: 4px; background: var(--accent); color: var(--accent-text); font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; }
  footer { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 28px; display: flex; gap: 16px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">frey<b>/</b>schnitt</div><a href="#">TERMINE →</a></header>

  <h1>Kopf<br>frei<em>.</em></h1>
  <p class="lead">Slot aussuchen, Namen rein, fertig. Bestätigung kommt per Mail.</p>

  <h2>// Freie Slots</h2>
  <div class="list">
    <div class="row">
      <div class="date"><small>Di</small><b>24.11</b></div>
      <div class="slots"><button class="s">18:00</button><button class="s sel">18:45</button><button class="s">19:30</button><button class="s">20:15</button></div>
    </div>
    <div class="row">
      <div class="date"><small>Do</small><b>26.11</b></div>
      <div class="slots"><button class="s">18:00</button><button class="s">19:30</button><button class="s">20:15</button></div>
    </div>
  </div>

  <h2>// Buchen</h2>
  <div class="form">
    <div class="picked">→ DI 24.11 · 18:45–19:30</div>
    <label for="n">Name</label><input id="n">
    <label for="e">E-Mail</label><input id="e" type="email">
    <label for="s">Leistung</label>
    <select id="s"><option>Haarschnitt</option><option>Haarschnitt + Bart</option><option>Nur Bart</option></select>
    <label for="no">Notiz (optional)</label><textarea id="no" rows="3"></textarea>
    <label class="check"><input type="checkbox"> <span>Ich habe die <a href="#">Datenschutzerklärung</a> gelesen und bin einverstanden.</span></label>
    <button class="btn">Termin buchen</button>
  </div>

  <footer><a href="#">Datenschutz</a><a href="#">Impressum</a></footer>
</div>
</body>
</html>
