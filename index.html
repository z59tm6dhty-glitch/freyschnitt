<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://uxvnlxhuhxcaexeznhck.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0d0d0e">
<meta name="description" content="Freie Termine für einen frischen Schnitt – einfach Slot aussuchen und eintragen.">
<title>Freyschnitt – Termin buchen</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0d0e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d4ff3a'/%3E%3C/svg%3E">
</head>
<body>
<div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="wrap">
  <header class="glass">
    <a class="logo" href="./">frey<b>/</b>schnitt</a>
    <nav><a href="#termine">TERMINE →</a></nav>
  </header>

  <main>
    <h1>Kopf<br>frei<em>.</em></h1>
    <p class="lead">Slot aussuchen, Namen rein, fertig. Bestätigung kommt per Mail.</p>

    <section class="glass" id="gate" aria-labelledby="gate-h" hidden>
      <h2 id="gate-h">Nur für Freunde</h2>
      <form id="gate-form">
        <label for="code">Passwort</label>
        <input id="code" name="code" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required maxlength="200" placeholder="Hab ich dir gesagt">
        <p id="gate-msg" class="msg error" role="alert"></p>
        <button class="btn" id="gate-btn" type="submit">Los</button>
      </form>
    </section>

    <section class="glass" id="termine" aria-labelledby="termine-h" hidden>
      <h2 id="termine-h">Freie Termine</h2>
      <p id="slots-msg" class="msg error" role="alert"></p>
      <div id="slots" aria-live="polite"><p class="loading">Lade Termine …</p></div>
    </section>

    <section class="glass" id="buchen" aria-labelledby="buchen-h" hidden>
      <h2 id="buchen-h">Buchen</h2>
      <form id="form" novalidate>
        <div class="picked"><span id="picked-text"></span><button type="button" id="change">ändern</button></div>

        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" required minlength="2" maxlength="80" placeholder="Dein Name">

        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254" placeholder="du@beispiel.de">

        <label for="note">Notiz (optional)</label>
        <textarea id="note" name="note" maxlength="500" rows="3"></textarea>

        <!-- Honeypot: bitte leer lassen (für Menschen unsichtbar) -->
        <div class="hp" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <label class="check"><input type="checkbox" id="consent" required>
          <span>Ich habe die <a href="datenschutz.html" target="_blank" rel="noopener">Datenschutzerklärung</a> gelesen und bin einverstanden, dass meine Angaben zur Terminvergabe gespeichert werden.</span></label>

        <p id="msg" class="msg error" role="alert"></p>
        <button class="btn" id="submit" type="submit">Termin buchen</button>
      </form>
    </section>
  </main>

  <footer><a href="datenschutz.html">Datenschutz</a></footer>
</div>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
